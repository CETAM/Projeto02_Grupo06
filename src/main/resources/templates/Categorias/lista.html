<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Categorias</title>


    <!-- Bootstrap -->

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


    <!-- CSS -->

    <link
            rel="stylesheet"
            th:href="@{/css/style.css}">

</head>


<body class="bg-light">


<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
                class="navbar-brand"
                th:href="@{/}">

            <i class="bi bi-box-seam me-2"></i>

            Sistema de Pedidos

        </a>

    </div>

</nav>


<!-- CONTEÚDO -->

<div class="container mt-5 mb-5">


    <!-- CABEÇALHO -->

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">

        <div>

            <h2 class="mb-1">
                Categorias
            </h2>

            <p class="text-muted mb-0">
                Gerenciamento das categorias de produtos
            </p>

        </div>


        <div class="d-flex flex-wrap gap-2">

            <a
                    th:href="@{/}"
                    class="btn btn-outline-secondary">

                <i class="bi bi-house-door me-1"></i>

                Início

            </a>


            <a
                    th:href="@{/categorias/novo}"
                    class="btn btn-primary">

                <i class="bi bi-plus-circle me-1"></i>

                Nova Categoria

            </a>

        </div>

    </div>


    <!-- TABELA -->

    <div class="card shadow">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-striped table-hover align-middle">

                    <thead>

                    <tr>

                        <th>ID</th>

                        <th>Nome</th>

                        <th>Descrição</th>

                        <th>Data de Criação</th>

                        <th>Ações</th>

                    </tr>

                    </thead>


                    <tbody>


                    <!-- CATEGORIAS -->

                    <tr th:each="categoria : ${categorias}">

                        <td th:text="${categoria.id}">
                        </td>


                        <td th:text="${categoria.nome}">
                        </td>


                        <td th:text="${categoria.descricao}">
                        </td>


                        <td th:text="${categoria.dataCriacao}">
                        </td>


                        <!-- AÇÕES -->

                        <td>

                            <div class="d-flex gap-2">

                                <a
                                        th:href="@{/categorias/editar/{id}(id=${categoria.id})}"
                                        class="btn btn-warning btn-sm">

                                    <i class="bi bi-pencil me-1"></i>

                                    Editar

                                </a>


                                <form
                                        th:action="@{/categorias/excluir/{id}(id=${categoria.id})}"
                                        method="post">

                                    <button
                                            type="submit"
                                            class="btn btn-danger btn-sm"
                                            onclick="return confirm('Deseja realmente excluir esta categoria?')">

                                        <i class="bi bi-trash me-1"></i>

                                        Excluir

                                    </button>

                                </form>

                            </div>

                        </td>

                    </tr>


                    <!-- TABELA VAZIA -->

                    <tr th:if="${#lists.isEmpty(categorias)}">

                        <td
                                colspan="5"
                                class="text-center text-muted py-4">

                            Nenhuma categoria cadastrada.

                        </td>

                    </tr>


                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


</body>
</html>
