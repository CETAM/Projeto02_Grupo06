<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Categorias | Sistema de Controle de Pedidos</title>

    <!-- Evita "flash" de tema errado antes do CSS carregar -->
    <script>
        (function () {
            var salvo = localStorage.getItem('spd-theme');
            document.documentElement.setAttribute('data-theme', salvo === 'dark' ? 'dark' : 'light');
        })();
    </script>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

    <!-- CSS do projeto -->
    <link
            rel="stylesheet"
            th:href="@{/css/style.css}">

</head>

<body>

<div class="app-shell">

    <!-- SIDEBAR -->
    <div th:replace="~{fragments/layout :: sidebar('categorias')}"></div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="main-content">

        <!-- TOPBAR -->
        <div th:replace="~{fragments/layout :: topbar('Categorias')}"></div>

        <main class="dashboard">

            <div class="list-header">

                <div>
                    <h1>Categorias</h1>
                    <p>Organização dos produtos por categoria</p>
                </div>

                <div class="d-flex flex-wrap gap-2">

                    <a th:href="@{/}" class="btn-app-outline">
                        <i class="bi bi-house-door"></i>
                        Início
                    </a>

                    <button
                            type="button"
                            class="btn-app-primary"
                            onclick="abrirModalNovaCategoria()">

                        <i class="bi bi-plus-lg"></i>
                        Nova Categoria

                    </button>

                </div>

            </div>

            <!-- MENSAGEM DE ERRO (ex: exclusão bloqueada por produtos vinculados) -->
            <div th:if="${erro != null}" class="alert-inline alert-inline-danger">
                <i class="bi bi-x-circle"></i>
                <span th:text="${erro}"></span>
            </div>

            <!-- BUSCA -->
            <div class="list-toolbar">

                <div class="list-search">
                    <i class="bi bi-search"></i>
                    <input
                            type="text"
                            id="filtroNome"
                            placeholder="Buscar categoria pelo nome..."
                            onkeyup="filtrarCategorias()">
                </div>

            </div>

            <!-- TABELA -->
            <div class="app-table-card">

                <div class="table-responsive">

                    <table class="app-table" id="tabelaCategorias">

                        <thead>
                        <tr>
                            <th>Categoria</th>
                            <th>Produtos vinculados</th>
                            <th>Criada em</th>
                            <th>Ações</th>
                        </tr>
                        </thead>

                        <tbody>

                        <tr th:each="categoria : ${categorias}"
                            class="linha-categoria"
                            th:attr="data-nome=${#strings.toLowerCase(categoria.nome)}">

                            <!-- NOME + DESCRIÇÃO -->
                            <td>
                                <span class="product-name" th:text="${categoria.nome}"></span>
                                <span
                                        class="product-desc"
                                        th:if="${categoria.descricao != null and !categoria.descricao.isEmpty()}"
                                        th:text="${categoria.descricao}"></span>
                            </td>

                            <!-- PRODUTOS VINCULADOS -->
                            <td>
                                <span th:if="${contagemProdutos.get(categoria.id) == 0}" class="category-badge">
                                    <i class="bi bi-box"></i>
                                    Nenhum produto
                                </span>
                                <span th:if="${contagemProdutos.get(categoria.id) > 0}" class="pill pill-success">
                                    <span th:text="${contagemProdutos.get(categoria.id)}"></span>
                                    produto(s)
                                </span>
                            </td>

                            <!-- DATA DE CRIAÇÃO -->
                            <td>
                                <span class="price-value"
                                      th:text="${#temporals.format(categoria.dataCriacao, 'dd/MM/yyyy')}"></span>
                            </td>

                            <!-- AÇÕES -->
                            <td>

                                <div class="row-actions">

                                    <button
                                            type="button"
                                            class="btn-icon-action edit"
                                            title="Editar categoria"
                                            th:data-id="${categoria.id}"
                                            th:data-nome="${categoria.nome}"
                                            th:data-descricao="${categoria.descricao}"
                                            onclick="abrirModalEditarCategoria(this)">

                                        <i class="bi bi-pencil"></i>

                                    </button>

                                    <form
                                            th:action="@{/categorias/excluir/{id}(id=${categoria.id})}"
                                            method="post"
                                            style="display:inline;">

                                        <button
                                                type="submit"
                                                class="btn-icon-action delete"
                                                title="Excluir categoria"
                                                th:disabled="${contagemProdutos.get(categoria.id) > 0}"
                                                th:attr="title=${contagemProdutos.get(categoria.id) > 0
                                                    ? 'Não é possível excluir: há produtos vinculados a esta categoria'
                                                    : 'Excluir categoria'}"
                                                onclick="return confirm('Deseja realmente excluir esta categoria?')">

                                            <i class="bi bi-trash"></i>

                                        </button>

                                    </form>

                                </div>

                            </td>

                        </tr>

                        <!-- CASO NÃO EXISTAM CATEGORIAS -->
                        <tr th:if="${#lists.isEmpty(categorias)}">
                            <td colspan="4">
                                <div class="app-empty-state">
                                    <i class="bi bi-tags"></i>
                                    Nenhuma categoria cadastrada.
                                </div>
                            </td>
                        </tr>

                        </tbody>

                    </table>

                    <!-- MENSAGEM QUANDO A BUSCA NÃO ENCONTRA NADA -->
                    <div id="semResultadoFiltro" class="app-empty-state" style="display:none;">
                        <i class="bi bi-search"></i>
                        Nenhuma categoria encontrada para essa busca.
                    </div>

                </div>

            </div>

        </main>

    </div>

</div>


<!-- ==============================================================
     MODAL DE CADASTRO / EDIÇÃO DE CATEGORIA
     ============================================================== -->

<div class="modal fade" id="categoriaModal" tabindex="-1" aria-labelledby="categoriaModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content app-modal">

            <form
                    id="categoriaForm"
                    th:action="@{/categorias/salvar}"
                    method="post">

                <div class="modal-header">
                    <h5 class="modal-title" id="categoriaModalLabel">Cadastrar Categoria</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>

                <div class="modal-body">

                    <input type="hidden" id="categoriaId" name="id">

                    <div class="mb-3">
                        <label class="form-label">Nome</label>
                        <input type="text" class="form-control" id="categoriaNome" name="nome" maxlength="100" required>
                    </div>

                    <div class="mb-1">
                        <label class="form-label">Descrição</label>
                        <textarea class="form-control" id="categoriaDescricao" name="descricao" rows="3"></textarea>
                    </div>

                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-app-outline" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn-app-primary">
                        <i class="bi bi-check-lg"></i>
                        Salvar
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<!-- Toggle de tema -->
<script th:src="@{/js/theme.js}"></script>

<script>
    const categoriaModalEl = document.getElementById('categoriaModal');
    const categoriaModal = new bootstrap.Modal(categoriaModalEl);

    function limparFormularioCategoria() {
        document.getElementById('categoriaForm').reset();
        document.getElementById('categoriaId').value = '';
    }

    function abrirModalNovaCategoria() {
        limparFormularioCategoria();
        document.getElementById('categoriaModalLabel').textContent = 'Cadastrar Categoria';
        categoriaModal.show();
    }

    function abrirModalEditarCategoria(botao) {
        const dados = botao.dataset;

        document.getElementById('categoriaId').value = dados.id;
        document.getElementById('categoriaNome').value = dados.nome || '';
        document.getElementById('categoriaDescricao').value = dados.descricao || '';

        document.getElementById('categoriaModalLabel').textContent = 'Editar Categoria';
        categoriaModal.show();
    }

    // Busca por nome (client-side, sem ida ao servidor)
    function filtrarCategorias() {
        const termo = document.getElementById('filtroNome').value.trim().toLowerCase();
        const linhas = document.querySelectorAll('#tabelaCategorias .linha-categoria');

        let visiveis = 0;

        linhas.forEach(function (linha) {
            const mostrar = linha.dataset.nome.includes(termo);
            linha.style.display = mostrar ? '' : 'none';

            if (mostrar) {
                visiveis++;
            }
        });

        document.getElementById('semResultadoFiltro').style.display = (visiveis === 0 && linhas.length > 0) ? 'block' : 'none';
    }
</script>

</body>
</html>
