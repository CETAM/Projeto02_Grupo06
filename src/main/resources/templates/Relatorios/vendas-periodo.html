<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Relatório de Vendas por Período</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- CSS do projeto -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <i class="bi bi-box-seam me-2"></i> Sistema de Pedidos
        </a>
    </div>
</nav>

<!-- CONTEÚDO -->
<div class="container mt-5 mb-5">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h2 class="mb-1"><i class="bi bi-calendar-range-fill me-2"></i>Vendas por Período</h2>
            <p class="text-muted mb-0">Consulte o histórico de vendas dentro de um intervalo de datas.</p>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <a th:href="@{/}" class="btn btn-outline-secondary">
                <i class="bi bi-house-door me-1"></i> Início
            </a>
            <button onclick="window.print()" class="btn btn-primary">
                <i class="bi bi-printer me-1"></i> Imprimir Relatório
            </button>
        </div>
    </div>

    <!-- CAIXA DE FILTRO DE DATAS -->
    <div class="card shadow-sm mb-4">
        <div class="card-body bg-white">
            <form th:action="@{/relatorios/vendas-periodo}" method="get" class="row align-items-end g-3">

                <div class="col-md-4">
                    <label for="dataInicio" class="form-label fw-bold">Data Inicial:</label>
                    <input type="date" id="dataInicio" name="dataInicio" class="form-control" th:value="${dataInicio}" required>
                </div>

                <div class="col-md-4">
                    <label for="dataFim" class="form-label fw-bold">Data Final:</label>
                    <input type="date" id="dataFim" name="dataFim" class="form-control" th:value="${dataFim}" required>
                </div>

                <div class="col-md-4">
                    <button type="submit" class="btn btn-dark w-100">
                        <i class="bi bi-funnel me-1"></i> Filtrar Vendas
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- TABELA DE RESULTADOS -->
    <div class="card shadow" th:if="${pedidos != null}">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>Nº do Pedido</th>
                        <th>Cliente</th>
                        <th>Data do Pedido</th>
                        <th>Status</th>
                        <th>Valor Total</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="pedido : ${pedidos}">
                        <td class="fw-bold" th:text="${pedido.id}"></td>

                        <!-- Acessa o nome do cliente ligado a esse pedido -->
                        <td th:text="${pedido.cliente.nome}"></td>

                        <td th:text="${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy HH:mm')}"></td>

                        <td>
                            <span class="badge bg-primary" th:text="${pedido.status}"></span>
                        </td>

                        <td class="text-success fw-bold" th:text="|R$ ${pedido.valorTotal}|"></td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="5" class="text-center text-muted py-4 fs-5">
                            <i class="bi bi-calendar-x me-2"></i> Nenhuma venda foi registrada neste período.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

</body>
</html>
