<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Relatório de Pedidos por Cliente</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- CSS do projeto -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <i class="bi bi-box-seam me-2"></i> Sistema de Pedidos
        </a>
    </div>
</nav>

<!-- CONTEÚDO -->
<div class="container mt-5 mb-5">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h2 class="mb-1"><i class="bi bi-person-lines-fill me-2"></i>Pedidos por Cliente</h2>
            <p class="text-muted mb-0">Consulte o histórico de pedidos de um cliente específico.</p>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <a th:href="@{/}" class="btn btn-outline-secondary">
                <i class="bi bi-house-door me-1"></i> Início
            </a>
            <button onclick="window.print()" class="btn btn-primary">
                <i class="bi bi-printer me-1"></i> Imprimir Relatório
            </button>
        </div>
    </div>

    <!-- CAIXA DE FILTRO -->
    <div class="card shadow-sm mb-4">
        <div class="card-body bg-white">
            <form th:action="@{/relatorios/pedidos-cliente}" method="get" class="row align-items-end g-3">
                <div class="col-md-8">
                    <label for="clienteId" class="form-label fw-bold">Selecione o Cliente:</label>
                    <select id="clienteId" name="clienteId" class="form-select" required>
                        <option value="" disabled th:selected="${clienteSelecionado == null}">-- Escolha um cliente --</option>
                        <!-- Preenche as opções com os clientes do banco -->
                        <option th:each="cliente : ${clientes}"
                                th:value="${cliente.id}"
                                th:text="${cliente.nome}"
                                th:selected="${clienteSelecionado == cliente.id}">
                        </option>
                    </select>
                </div>
                <div class="col-md-4">
                    <button type="submit" class="btn btn-dark w-100">
                        <i class="bi bi-funnel me-1"></i> Filtrar Pedidos
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- TABELA DE RESULTADOS (Só aparece se o usuário filtrou algo) -->
    <div class="card shadow" th:if="${pedidos != null}">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>Nº do Pedido</th>
                        <th>Data do Pedido</th>
                        <th>Data de Entrega</th>
                        <th>Status</th>
                        <th>Valor Total</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="pedido : ${pedidos}">
                        <td class="fw-bold" th:text="${pedido.id}"></td>

                        <!-- Formatação de datas usando o #temporals do Thymeleaf -->
                        <td th:text="${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${pedido.dataEntrega != null ? #temporals.format(pedido.dataEntrega, 'dd/MM/yyyy HH:mm') : 'Não definida'}"></td>

                        <td>
                            <span class="badge bg-primary" th:text="${pedido.status}"></span>
                        </td>

                        <td class="text-success fw-bold" th:text="|R$ ${pedido.valorTotal}|"></td>
                    </tr>

                    <!-- Mensagem caso o cliente selecionado não tenha nenhum pedido -->
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="5" class="text-center text-muted py-4 fs-5">
                            <i class="bi bi-inbox me-2"></i> Este cliente ainda não possui nenhum pedido registrado.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

</body>
</html>
