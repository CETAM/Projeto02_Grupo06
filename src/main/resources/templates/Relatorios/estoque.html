<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Controle de Estoque | Sistema de Controle de Pedidos</title>

    <!-- Evita "flash" de tema errado antes do CSS carregar -->
    <script>
        (function () {
            var salvo = localStorage.getItem('spd-theme');
            document.documentElement.setAttribute('data-theme', salvo === 'dark' ? 'dark' : 'light');
        })();
    </script>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

    <!-- CSS do projeto -->
    <link
            rel="stylesheet"
            th:href="@{/css/style.css}">

</head>

<body>

<div class="app-shell">

    <!-- SIDEBAR -->
    <div th:replace="~{fragments/layout :: sidebar('estoque')}"></div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="main-content">

        <!-- TOPBAR -->
        <div th:replace="~{fragments/layout :: topbar('Controle de Estoque')}"></div>

        <main class="dashboard">

            <div class="list-header">

                <div>
                    <h1>Controle de Estoque</h1>
                    <p>Produtos esgotados ou com quantidade zerada no momento</p>
                </div>

                <div class="d-flex flex-wrap gap-2 no-print">

                    <a th:href="@{/}" class="btn-app-outline">
                        <i class="bi bi-house-door"></i>
                        Início
                    </a>

                    <a th:href="@{/relatorios}" class="btn-app-outline">
                        <i class="bi bi-grid-3x3-gap"></i>
                        Relatórios
                    </a>

                    <button
                            type="button"
                            class="btn-app-primary"
                            onclick="window.print()">

                        <i class="bi bi-printer"></i>
                        Imprimir Relatório

                    </button>

                </div>

            </div>

            <!-- CONTEXTO DO RESULTADO -->
            <p class="text-muted mb-3">
                <i class="bi bi-info-circle me-1"></i>
                <span th:text="${#lists.size(produtos)}">0</span> produto(s) em falta encontrado(s).
            </p>

            <!-- TABELA -->
            <div class="app-table-card">

                <div class="table-responsive">

                    <table class="app-table">

                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Produto</th>
                            <th>Categoria</th>
                            <th>Preço</th>
                            <th>Estoque</th>
                            <th>Status</th>
                        </tr>
                        </thead>

                        <tbody>

                        <tr th:each="produto : ${produtos}">

                            <td th:text="${produto.id}"></td>

                            <td>
                                <span class="product-name" th:text="${produto.nome}"></span>
                            </td>

                            <td>
                                <span class="category-badge">
                                    <i class="bi bi-tag"></i>
                                    <span th:text="${produto.categoria.nome}"></span>
                                </span>
                            </td>

                            <td>
                                <span class="price-value"
                                      th:text="|R$ ${#numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}|"></span>
                            </td>

                            <td>
                                <span class="pill pill-danger" th:text="${produto.quantidadeEstoque} + ' un'"></span>
                            </td>

                            <td>
                                <span class="pill pill-danger">
                                    <i class="bi bi-x-circle me-1"></i> Esgotado
                                </span>
                            </td>

                        </tr>

                        <!-- CASO O ESTOQUE ESTEJA OK (Nenhum produto zerado) -->
                        <tr th:if="${#lists.isEmpty(produtos)}">
                            <td colspan="6">
                                <div class="app-empty-state">
                                    <i class="bi bi-check-circle-fill" style="color: var(--teal);"></i>
                                    <span style="color: var(--teal); font-weight: 600;">Estoque normalizado!</span>
                                    Nenhum produto em falta no momento.
                                </div>
                            </td>
                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<!-- Toggle de tema -->
<script th:src="@{/js/theme.js}"></script>

</body>
</html>
