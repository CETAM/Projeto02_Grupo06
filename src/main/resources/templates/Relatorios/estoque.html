<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Relatório de Estoque</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS do projeto -->
    <link
            rel="stylesheet"
            th:href="@{/css/style.css}">

</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand"
           th:href="@{/}">

            <i class="bi bi-box-seam me-2"></i>

            Sistema de Pedidos

        </a>

    </div>

</nav>

<!-- CONTEÚDO -->
<div class="container mt-5 mb-5">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">

        <div>

            <h2 class="mb-1 text-danger">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                Alerta de Estoque
            </h2>

            <p class="text-muted mb-0">
                Relatório de produtos esgotados ou com quantidade zerada.
            </p>

        </div>

        <div class="d-flex flex-wrap gap-2">

            <a
                    th:href="@{/}"
                    class="btn btn-outline-secondary">

                <i class="bi bi-house-door me-1"></i>

                Início

            </a>

            <!-- Botão extra para simular a impressão do relatório -->
            <button
                    onclick="window.print()"
                    class="btn btn-primary">

                <i class="bi bi-printer me-1"></i>

                Imprimir Relatório

            </button>

        </div>

    </div>

    <!-- TABELA DE RELATÓRIO -->
    <div class="card shadow border-danger">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-striped table-hover align-middle">

                    <thead class="table-danger">

                    <tr>

                        <th>ID</th>
                        <th>Produto</th>
                        <th>Categoria</th>
                        <th>Preço Unitário</th>
                        <th>Quantidade em Estoque</th>
                        <th>Status</th>

                    </tr>

                    </thead>

                    <tbody>

                    <!-- O laço pega a lista "produtos" enviada pelo seu RelatorioController -->
                    <tr th:each="produto : ${produtos}">

                        <td th:text="${produto.id}"></td>

                        <td class="fw-bold" th:text="${produto.nome}"></td>

                        <!-- Acessa o nome da categoria através do relacionamento na entidade Produto -->
                        <td th:text="${produto.categoria.nome}"></td>

                        <td th:text="|R$ ${produto.preco}|"></td>

                        <td class="text-danger fw-bold fs-5" th:text="${produto.quantidadeEstoque}"></td>

                        <!-- STATUS COM ALERTA VISUAL (Exigência do Trello) -->
                        <td>
                            <span class="badge bg-danger">
                                <i class="bi bi-x-circle me-1"></i> Esgotado
                            </span>
                        </td>

                    </tr>

                    <!-- CASO O ESTOQUE ESTEJA OK (Nenhum produto zerado) -->
                    <tr th:if="${#lists.isEmpty(produtos)}">

                        <td
                                colspan="6"
                                class="text-center text-success py-4 fs-5">
                            <i class="bi bi-check-circle-fill me-2"></i>
                            Estoque normalizado! Nenhum produto em falta no momento.
                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>
</html>
