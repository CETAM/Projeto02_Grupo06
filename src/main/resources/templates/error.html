<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Erro | Sistema de Controle de Pedidos</title>

    <!-- Evita "flash" de tema errado antes do CSS carregar -->
    <script>
        (function () {
            var salvo = localStorage.getItem('spd-theme');
            document.documentElement.setAttribute('data-theme', salvo === 'dark' ? 'dark' : 'light');
        })();
    </script>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

    <!-- CSS do projeto -->
    <link
            rel="stylesheet"
            th:href="@{/css/style.css}">

</head>

<body>

<div class="app-shell">

    <!-- SIDEBAR -->
    <div th:replace="~{fragments/layout :: sidebar('')}"></div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="main-content">

        <!-- TOPBAR -->
        <div th:replace="~{fragments/layout :: topbar('Erro')}"></div>

        <main class="dashboard" style="display:flex; align-items:center; justify-content:center; min-height: 60vh;">

            <div style="text-align:center; max-width: 420px;">

                <i class="bi bi-exclamation-octagon" style="font-size: 3rem; color: var(--coral);"></i>

                <h1 style="margin-top: 1rem;">Algo deu errado</h1>

                <p style="color: var(--text-muted); margin-bottom: 1.5rem;" th:text="${mensagem}">
                    Ocorreu um erro inesperado. Tente novamente em instantes.
                </p>

                <a th:href="@{/}" class="btn-app-primary">
                    <i class="bi bi-house-door"></i>
                    Voltar para o início
                </a>

            </div>

        </main>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<!-- Toggle de tema -->
<script th:src="@{/js/theme.js}"></script>

</body>
</html>
