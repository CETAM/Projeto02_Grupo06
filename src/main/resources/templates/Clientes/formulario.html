<!DOCTYPE html>

<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title th:text="${cliente.id == null}
            ? 'Cadastrar Cliente'
            : 'Editar Cliente'">

        Cliente

    </title>


    <!-- Bootstrap -->

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


    <!-- CSS -->

    <link
            rel="stylesheet"
            th:href="@{/css/style.css}">

</head>


<body class="bg-light">


<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
                class="navbar-brand"
                th:href="@{/}">

            <i class="bi bi-box-seam me-2"></i>

            Sistema de Pedidos

        </a>

    </div>

</nav>


<!-- CONTEÚDO -->

<div class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-lg-9">


            <div class="card shadow">


                <!-- CABEÇALHO -->

                <div class="card-header bg-white py-3">

                    <h4
                            class="mb-1"
                            th:text="${cliente.id == null}
                            ? 'Cadastrar Cliente'
                            : 'Editar Cliente'">

                        Cliente

                    </h4>


                    <small class="text-muted">

                        Preencha os dados do cliente.

                    </small>

                </div>


                <!-- FORMULÁRIO -->

                <div class="card-body p-4">

                    <form
                            th:action="@{/clientes/salvar}"
                            th:object="${cliente}"
                            method="post">


                        <!-- ID -->

                        <input
                                type="hidden"
                                th:field="*{id}">


                        <!-- NOME -->

                        <div class="mb-3">

                            <label
                                    for="nome"
                                    class="form-label">

                                Nome

                            </label>


                            <input
                                    id="nome"
                                    type="text"
                                    class="form-control"
                                    th:field="*{nome}"
                                    placeholder="Ex.: Maria Oliveira"
                                    maxlength="150"
                                    required>

                        </div>


                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label
                                    for="email"
                                    class="form-label">

                                E-mail

                            </label>


                            <input
                                    id="email"
                                    type="email"
                                    class="form-control"
                                    th:field="*{email}"
                                    placeholder="Ex.: maria.oliveira@email.com"
                                    maxlength="100"
                                    required>

                        </div>


                        <!-- TELEFONE / CEP -->

                        <div class="row">


                            <!-- TELEFONE -->

                            <div class="col-md-6 mb-3">

                                <label
                                        for="telefone"
                                        class="form-label">

                                    Telefone

                                </label>


                                <input
                                        id="telefone"
                                        type="tel"
                                        class="form-control"
                                        th:field="*{telefone}"
                                        placeholder="Ex.: (92) 991772667"
                                        maxlength="14"
                                        inputmode="numeric">

                            </div>


                            <!-- CEP -->

                            <div class="col-md-6 mb-3">

                                <label
                                        for="cep"
                                        class="form-label">

                                    CEP

                                </label>


                                <input
                                        id="cep"
                                        type="text"
                                        class="form-control"
                                        th:field="*{cep}"
                                        placeholder="Ex.: 69063-490"
                                        maxlength="9"
                                        inputmode="numeric">

                            </div>

                        </div>


                        <!-- ENDEREÇO -->

                        <div class="mb-3">

                            <label
                                    for="endereco"
                                    class="form-label">

                                Endereço

                            </label>


                            <textarea
                                    id="endereco"
                                    class="form-control"
                                    th:field="*{endereco}"
                                    rows="3"
                                    placeholder="Ex.: Av. Brasil, 1000 - Centro">
                            </textarea>

                        </div>


                        <!-- CIDADE / ESTADO -->

                        <div class="row">


                            <!-- CIDADE -->

                            <div class="col-md-8 mb-3">

                                <label
                                        for="cidade"
                                        class="form-label">

                                    Cidade

                                </label>


                                <input
                                        id="cidade"
                                        type="text"
                                        class="form-control"
                                        th:field="*{cidade}"
                                        placeholder="Ex.: Manaus"
                                        maxlength="100">

                            </div>


                            <!-- ESTADO -->

                            <div class="col-md-4 mb-3">

                                <label
                                        for="estado"
                                        class="form-label">

                                    Estado

                                </label>


                                <input
                                        id="estado"
                                        type="text"
                                        class="form-control"
                                        th:field="*{estado}"
                                        placeholder="Ex.: AM"
                                        maxlength="2">

                            </div>

                        </div>


                        <!-- STATUS -->

                        <div class="form-check mb-4">

                            <input
                                    id="ativo"
                                    class="form-check-input"
                                    type="checkbox"
                                    th:field="*{ativo}">


                            <label
                                    for="ativo"
                                    class="form-check-label">

                                Cliente ativo

                            </label>

                        </div>


                        <!-- BOTÕES -->

                        <div class="d-flex flex-wrap gap-2">


                            <button
                                    type="submit"
                                    class="btn btn-primary">

                                <i class="bi bi-check-lg me-1"></i>

                                Salvar

                            </button>


                            <a
                                    th:href="@{/clientes}"
                                    class="btn btn-secondary">

                                <i class="bi bi-arrow-left me-1"></i>

                                Voltar para Clientes

                            </a>


                            <a
                                    th:href="@{/}"
                                    class="btn btn-outline-dark">

                                <i class="bi bi-house-door me-1"></i>

                                Página inicial

                            </a>

                        </div>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- JAVASCRIPT DOS CLIENTES -->

<script th:src="@{/js/clientes.js(v=4)}"></script>


</body>

</html>
