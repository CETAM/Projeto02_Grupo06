<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Cadastro de Cliente</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand"
           th:href="@{/clientes}">
            Sistema de Pedidos
        </a>

    </div>

</nav>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-header">

                    <h4 class="mb-0"
                        th:text="${cliente.id == null}
                        ? 'Cadastrar Cliente'
                        : 'Editar Cliente'">

                        Cadastro de Cliente

                    </h4>

                </div>


                <div class="card-body">

                    <form
                            th:action="@{/clientes/salvar}"
                            th:object="${cliente}"
                            method="post">

                        <input
                                type="hidden"
                                th:field="*{id}">


                        <div class="mb-3">

                            <label class="form-label">
                                Nome
                            </label>

                            <input
                                    type="text"
                                    class="form-control"
                                    th:field="*{nome}"
                                    maxlength="150"
                                    required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                E-mail
                            </label>

                            <input
                                    type="email"
                                    class="form-control"
                                    th:field="*{email}"
                                    maxlength="100"
                                    required>

                        </div>


                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Telefone
                                </label>

                                <input
                                        type="text"
                                        class="form-control"
                                        th:field="*{telefone}"
                                        maxlength="20">

                            </div>


                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    CEP
                                </label>

                                <input
                                        type="text"
                                        class="form-control"
                                        th:field="*{cep}"
                                        maxlength="10">

                            </div>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Endereço
                            </label>

                            <textarea
                                    class="form-control"
                                    th:field="*{endereco}"
                                    rows="3">
                            </textarea>

                        </div>


                        <div class="row">

                            <div class="col-md-8 mb-3">

                                <label class="form-label">
                                    Cidade
                                </label>

                                <input
                                        type="text"
                                        class="form-control"
                                        th:field="*{cidade}"
                                        maxlength="100">

                            </div>


                            <div class="col-md-4 mb-3">

                                <label class="form-label">
                                    Estado
                                </label>

                                <input
                                        type="text"
                                        class="form-control"
                                        th:field="*{estado}"
                                        maxlength="2"
                                        placeholder="AM">

                            </div>

                        </div>


                        <div class="form-check mb-4">

                            <input
                                    class="form-check-input"
                                    type="checkbox"
                                    th:field="*{ativo}">

                            <label class="form-check-label">
                                Cliente ativo
                            </label>

                        </div>


                        <div class="d-flex gap-2">

                            <button
                                    type="submit"
                                    class="btn btn-primary">

                                Salvar

                            </button>


                            <a
                                    th:href="@{/clientes}"
                                    class="btn btn-secondary">

                                Cancelar

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
