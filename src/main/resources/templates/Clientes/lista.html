<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Clientes | Sistema de Controle de Pedidos</title>

    <!-- Evita "flash" de tema errado antes do CSS carregar -->
    <script>
        (function () {
            var salvo = localStorage.getItem('spd-theme');
            document.documentElement.setAttribute('data-theme', salvo === 'dark' ? 'dark' : 'light');
        })();
    </script>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

    <!-- CSS do projeto -->
    <link
            rel="stylesheet"
            th:href="@{/css/style.css}">

</head>

<body>

<div class="app-shell">

    <!-- SIDEBAR -->
    <div th:replace="~{fragments/layout :: sidebar('clientes')}"></div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="main-content">

        <!-- TOPBAR -->
        <div th:replace="~{fragments/layout :: topbar('Clientes')}"></div>

        <main class="dashboard">

            <div class="list-header">

                <div>
                    <h1>Clientes</h1>
                    <p>Gerenciamento dos clientes cadastrados</p>
                </div>

                <div class="d-flex flex-wrap gap-2">

                    <a th:href="@{/}" class="btn-app-outline">
                        <i class="bi bi-house-door"></i>
                        Início
                    </a>

                    <button
                            type="button"
                            class="btn-app-primary"
                            onclick="abrirModalNovoCliente()">

                        <i class="bi bi-person-plus"></i>
                        Novo Cliente

                    </button>

                </div>

            </div>

            <!-- TABELA -->
            <div class="app-table-card">

                <div class="table-responsive">

                    <table class="app-table">

                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Telefone</th>
                            <th>Cidade</th>
                            <th>Estado</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                        </thead>

                        <tbody>

                        <tr th:each="cliente : ${clientes}">

                            <td th:text="${cliente.id}"></td>
                            <td th:text="${cliente.nome}"></td>
                            <td th:text="${cliente.email}"></td>
                            <td th:text="${cliente.telefone}"></td>
                            <td th:text="${cliente.cidade}"></td>
                            <td th:text="${cliente.estado}"></td>

                            <!-- STATUS -->
                            <td>
                                <span th:if="${cliente.ativo}" class="status-pill ativo">Ativo</span>
                                <span th:unless="${cliente.ativo}" class="status-pill inativo">Inativo</span>
                            </td>

                            <!-- AÇÕES -->
                            <td>

                                <div class="row-actions">

                                    <button
                                            type="button"
                                            class="btn-icon-action edit"
                                            title="Editar cliente"
                                            th:data-id="${cliente.id}"
                                            th:data-nome="${cliente.nome}"
                                            th:data-email="${cliente.email}"
                                            th:data-telefone="${cliente.telefone}"
                                            th:data-cep="${cliente.cep}"
                                            th:data-endereco="${cliente.endereco}"
                                            th:data-cidade="${cliente.cidade}"
                                            th:data-estado="${cliente.estado}"
                                            th:data-ativo="${cliente.ativo}"
                                            onclick="abrirModalEditarCliente(this)">

                                        <i class="bi bi-pencil"></i>

                                    </button>

                                    <form
                                            th:action="@{/clientes/excluir/{id}(id=${cliente.id})}"
                                            method="post"
                                            style="display:inline;">

                                        <button
                                                type="submit"
                                                class="btn-icon-action delete"
                                                title="Excluir cliente"
                                                onclick="return confirm('Deseja realmente excluir este cliente?')">

                                            <i class="bi bi-trash"></i>

                                        </button>

                                    </form>

                                </div>

                            </td>

                        </tr>

                        <!-- CASO NÃO EXISTAM CLIENTES -->
                        <tr th:if="${#lists.isEmpty(clientes)}">
                            <td colspan="8">
                                <div class="app-empty-state">
                                    <i class="bi bi-people"></i>
                                    Nenhum cliente cadastrado.
                                </div>
                            </td>
                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>

</div>


<!-- ==============================================================
     MODAL DE CADASTRO / EDIÇÃO DE CLIENTE
     ============================================================== -->

<div class="modal fade" id="clienteModal" tabindex="-1" aria-labelledby="clienteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content app-modal">

            <form
                    id="clienteForm"
                    th:action="@{/clientes/salvar}"
                    method="post">

                <div class="modal-header">
                    <h5 class="modal-title" id="clienteModalLabel">Cadastrar Cliente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>

                <div class="modal-body">

                    <input type="hidden" id="clienteId" name="id">

                    <div class="mb-3">
                        <label class="form-label">Nome</label>
                        <input type="text" class="form-control" id="clienteNome" name="nome" maxlength="150" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="clienteEmail" name="email" maxlength="100" required>
                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Telefone</label>
                            <input type="text" class="form-control" id="clienteTelefone" name="telefone" maxlength="20">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">CEP</label>
                            <input type="text" class="form-control" id="clienteCep" name="cep" maxlength="10">
                        </div>

                    </div>

                    <div class="mb-3">
                        <label class="form-label">Endereço</label>
                        <textarea class="form-control" id="clienteEndereco" name="endereco" rows="2"></textarea>
                    </div>

                    <div class="row">

                        <div class="col-md-8 mb-3">
                            <label class="form-label">Cidade</label>
                            <input type="text" class="form-control" id="clienteCidade" name="cidade" maxlength="100">
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Estado</label>
                            <input type="text" class="form-control" id="clienteEstado" name="estado" maxlength="2" placeholder="AM">
                        </div>

                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="clienteAtivo" name="ativo" value="true">
                        <label class="form-check-label" for="clienteAtivo">Cliente ativo</label>
                    </div>

                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-app-outline" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn-app-primary">
                        <i class="bi bi-check-lg"></i>
                        Salvar
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<!-- Toggle de tema -->
<script th:src="@{/js/theme.js}"></script>

<script>
    const clienteModalEl = document.getElementById('clienteModal');
    const clienteModal = new bootstrap.Modal(clienteModalEl);

    function limparFormularioCliente() {
        document.getElementById('clienteForm').reset();
        document.getElementById('clienteId').value = '';
        document.getElementById('clienteAtivo').checked = true;
    }

    function abrirModalNovoCliente() {
        limparFormularioCliente();
        document.getElementById('clienteModalLabel').textContent = 'Cadastrar Cliente';
        clienteModal.show();
    }

    function abrirModalEditarCliente(botao) {
        const dados = botao.dataset;

        document.getElementById('clienteId').value = dados.id;
        document.getElementById('clienteNome').value = dados.nome || '';
        document.getElementById('clienteEmail').value = dados.email || '';
        document.getElementById('clienteTelefone').value = dados.telefone || '';
        document.getElementById('clienteCep').value = dados.cep || '';
        document.getElementById('clienteEndereco').value = dados.endereco || '';
        document.getElementById('clienteCidade').value = dados.cidade || '';
        document.getElementById('clienteEstado').value = dados.estado || '';
        document.getElementById('clienteAtivo').checked = dados.ativo === 'true';

        document.getElementById('clienteModalLabel').textContent = 'Editar Cliente';
        clienteModal.show();
    }
</script>

</body>
</html>
