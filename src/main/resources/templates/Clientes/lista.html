<!DOCTYPE html>

<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Clientes</title>


    <!-- Bootstrap -->

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


    <!-- CSS do projeto -->

    <link
            rel="stylesheet"
            th:href="@{/css/style.css}">

</head>


<body class="bg-light">


<!-- ===================================================== -->
<!-- NAVBAR                                                -->
<!-- ===================================================== -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
                class="navbar-brand"
                th:href="@{/}">

            <i class="bi bi-box-seam me-2"></i>

            Sistema de Pedidos

        </a>

    </div>

</nav>


<!-- ===================================================== -->
<!-- CONTEÚDO PRINCIPAL                                    -->
<!-- ===================================================== -->

<div class="container mt-5 mb-5">


    <!-- CABEÇALHO -->

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">

        <div>

            <h2 class="mb-1">
                Clientes
            </h2>

            <p class="text-muted mb-0">
                Gerenciamento dos clientes cadastrados
            </p>

        </div>


        <!-- BOTÕES DO CABEÇALHO -->

        <div class="d-flex gap-2">


            <!-- INÍCIO -->

            <a
                    th:href="@{/}"
                    class="btn btn-outline-secondary">

                <i class="bi bi-house-door me-1"></i>

                Início

            </a>


            <!-- NOVO CLIENTE -->

            <button
                    type="button"
                    class="btn btn-primary"
                    data-bs-toggle="modal"
                    data-bs-target="#modalCadastroCliente">

                <i class="bi bi-person-plus me-1"></i>

                Novo Cliente

            </button>

        </div>

    </div>



    <!-- ================================================= -->
    <!-- TABELA                                            -->
    <!-- ================================================= -->

    <div class="card shadow">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-striped table-hover align-middle">

                    <thead>

                    <tr>

                        <th>ID</th>

                        <th>Nome</th>

                        <th>E-mail</th>

                        <th>Telefone</th>

                        <th>Cidade</th>

                        <th>Estado</th>

                        <th>Data de Cadastro</th>

                        <th>Status</th>

                        <th>Ações</th>

                    </tr>

                    </thead>


                    <tbody>


                    <!-- LISTAGEM DOS CLIENTES -->

                    <tr th:each="cliente : ${clientes}">


                        <td th:text="${cliente.id}">
                        </td>


                        <td th:text="${cliente.nome}">
                        </td>


                        <td th:text="${cliente.email}">
                        </td>


                        <td
                                class="text-nowrap"
                                th:text="${cliente.telefone}">
                        </td>


                        <td th:text="${cliente.cidade}">
                        </td>


                        <td th:text="${cliente.estado}">
                        </td>


                        <!-- DATA DE CADASTRO -->

                        <td
                                class="text-nowrap"
                                th:text="${cliente.dataCriacao != null
                                ? #temporals.format(cliente.dataCriacao, 'dd/MM/yyyy')
                                : '-'}">
                        </td>


                        <!-- STATUS -->

                        <td>

                            <span
                                    th:if="${cliente.ativo}"
                                    class="badge bg-success">

                                Ativo

                            </span>


                            <span
                                    th:unless="${cliente.ativo}"
                                    class="badge bg-secondary">

                                Inativo

                            </span>

                        </td>


                        <!-- AÇÕES -->

                        <td>

                            <div class="d-flex flex-nowrap gap-2">


                                <!-- EDITAR -->

                                <a
                                        th:href="@{/clientes/editar/{id}(id=${cliente.id})}"
                                        class="btn btn-warning btn-sm">

                                    <i class="bi bi-pencil me-1"></i>

                                    Editar

                                </a>


                                <!-- EXCLUIR -->

                                <form
                                        th:action="@{/clientes/excluir/{id}(id=${cliente.id})}"
                                        method="post">

                                    <button
                                            type="submit"
                                            class="btn btn-danger btn-sm"
                                            onclick="return confirm('Deseja realmente excluir este cliente?')">

                                        <i class="bi bi-trash me-1"></i>

                                        Excluir

                                    </button>

                                </form>

                            </div>

                        </td>

                    </tr>


                    <!-- CASO NÃO EXISTAM CLIENTES -->

                    <tr th:if="${#lists.isEmpty(clientes)}">

                        <td
                                colspan="9"
                                class="text-center text-muted py-4">

                            Nenhum cliente cadastrado.

                        </td>

                    </tr>


                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>



<!-- ===================================================== -->
<!-- MODAL CADASTRO DE CLIENTE                             -->
<!-- ===================================================== -->

<div
        class="modal fade"
        id="modalCadastroCliente"
        tabindex="-1"
        aria-labelledby="tituloModalCliente"
        aria-hidden="true">


    <div class="modal-dialog modal-lg modal-dialog-centered">


        <div class="modal-content">


            <!-- ========================================= -->
            <!-- CABEÇALHO DO MODAL                       -->
            <!-- ========================================= -->

            <div class="modal-header">

                <div>

                    <h5
                            class="modal-title"
                            id="tituloModalCliente">

                        <i class="bi bi-person-plus me-2"></i>

                        Cadastrar Cliente

                    </h5>


                    <small class="text-muted">

                        Preencha os dados para cadastrar um novo cliente.

                    </small>

                </div>


                <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Fechar">
                </button>

            </div>



            <!-- ========================================= -->
            <!-- FORMULÁRIO                               -->
            <!-- ========================================= -->

            <form
                    th:action="@{/clientes/salvar}"
                    th:object="${clienteForm}"
                    method="post">


                <div class="modal-body p-4">


                    <!-- ================================= -->
                    <!-- DADOS DO CLIENTE                  -->
                    <!-- ================================= -->

                    <h6 class="fw-bold text-primary mb-3">

                        <i class="bi bi-person me-2"></i>

                        Dados do Cliente

                    </h6>


                    <!-- NOME -->

                    <div class="mb-3">

                        <label
                                for="nome"
                                class="form-label">

                            Nome

                        </label>


                        <input
                                id="nome"
                                type="text"
                                class="form-control"
                                th:field="*{nome}"
                                placeholder="Ex.: Maria Oliveira"
                                maxlength="150"
                                required>

                    </div>



                    <!-- E-MAIL -->

                    <div class="mb-3">

                        <label
                                for="email"
                                class="form-label">

                            E-mail

                        </label>


                        <input
                                id="email"
                                type="email"
                                class="form-control"
                                th:field="*{email}"
                                placeholder="Ex.: maria.oliveira@email.com"
                                maxlength="100"
                                required>

                    </div>



                    <!-- TELEFONE -->

                    <div class="mb-3">

                        <label
                                for="telefone"
                                class="form-label">

                            Telefone

                        </label>


                        <input
                                id="telefone"
                                type="tel"
                                class="form-control"
                                th:field="*{telefone}"
                                placeholder="Ex.: (92) 991772667"
                                maxlength="20">

                    </div>



                    <hr class="my-4">



                    <!-- ================================= -->
                    <!-- ENDEREÇO                          -->
                    <!-- ================================= -->

                    <h6 class="fw-bold text-primary mb-3">

                        <i class="bi bi-geo-alt me-2"></i>

                        Endereço

                    </h6>



                    <!-- CEP -->

                    <div class="mb-3">

                        <label
                                for="cep"
                                class="form-label">

                            CEP

                        </label>


                        <input
                                id="cep"
                                type="text"
                                class="form-control"
                                th:field="*{cep}"
                                placeholder="Ex.: 69063-490"
                                maxlength="10">

                    </div>



                    <!-- ENDEREÇO -->

                    <div class="mb-3">

                        <label
                                for="endereco"
                                class="form-label">

                            Endereço

                        </label>


                        <textarea
                                id="endereco"
                                class="form-control"
                                th:field="*{endereco}"
                                rows="2"
                                placeholder="Ex.: Avenida Brasil, 1000 - Centro">
                        </textarea>

                    </div>



                    <!-- CIDADE E ESTADO -->

                    <div class="row">


                        <!-- CIDADE -->

                        <div class="col-md-8 mb-3">

                            <label
                                    for="cidade"
                                    class="form-label">

                                Cidade

                            </label>


                            <input
                                    id="cidade"
                                    type="text"
                                    class="form-control"
                                    th:field="*{cidade}"
                                    placeholder="Ex.: Manaus"
                                    maxlength="100">

                        </div>



                        <!-- ESTADO -->

                        <div class="col-md-4 mb-3">

                            <label
                                    for="estado"
                                    class="form-label">

                                Estado

                            </label>


                            <input
                                    id="estado"
                                    type="text"
                                    class="form-control"
                                    th:field="*{estado}"
                                    placeholder="Ex.: AM"
                                    maxlength="2">

                        </div>

                    </div>



                    <!-- ================================= -->
                    <!-- STATUS                            -->
                    <!-- ================================= -->

                    <div class="form-check mt-2">

                        <input
                                id="ativo"
                                class="form-check-input"
                                type="checkbox"
                                th:field="*{ativo}">


                        <label
                                for="ativo"
                                class="form-check-label">

                            Cliente ativo

                        </label>

                    </div>


                </div>



                <!-- ===================================== -->
                <!-- RODAPÉ DO MODAL                      -->
                <!-- ===================================== -->

                <div class="modal-footer">


                    <!-- CANCELAR -->

                    <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">

                        <i class="bi bi-x-lg me-1"></i>

                        Cancelar

                    </button>



                    <!-- SALVAR -->

                    <button
                            type="submit"
                            class="btn btn-primary">

                        <i class="bi bi-check-lg me-1"></i>

                        Salvar Cliente

                    </button>


                </div>


            </form>

        </div>

    </div>

</div>



<!-- ===================================================== -->
<!-- BOOTSTRAP JAVASCRIPT                                  -->
<!-- ===================================================== -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
