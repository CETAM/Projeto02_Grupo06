<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Clientes</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS do projeto -->
    <link
            rel="stylesheet"
            th:href="@{/css/style.css}">

</head>

<body class="bg-light">


<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand"
           th:href="@{/}">

            <i class="bi bi-box-seam me-2"></i>

            Sistema de Pedidos

        </a>

    </div>

</nav>


<!-- CONTEÚDO -->

<div class="container mt-5 mb-5">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">

        <div>

            <h2 class="mb-1">
                Clientes
            </h2>

            <p class="text-muted mb-0">
                Gerenciamento dos clientes cadastrados
            </p>

        </div>


        <div class="d-flex flex-wrap gap-2">

            <a
                    th:href="@{/}"
                    class="btn btn-outline-secondary">

                <i class="bi bi-house-door me-1"></i>

                Início

            </a>


            <a
                    th:href="@{/clientes/novo}"
                    class="btn btn-primary">

                <i class="bi bi-person-plus me-1"></i>

                Novo Cliente

            </a>

        </div>

    </div>


    <!-- TABELA -->

    <div class="card shadow">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-striped table-hover align-middle">

                    <thead>

                    <tr>

                        <th>ID</th>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Telefone</th>
                        <th>Cidade</th>
                        <th>Estado</th>
                        <th>Status</th>
                        <th>Ações</th>

                    </tr>

                    </thead>


                    <tbody>

                    <tr th:each="cliente : ${clientes}">

                        <td th:text="${cliente.id}"></td>

                        <td th:text="${cliente.nome}"></td>

                        <td th:text="${cliente.email}"></td>

                        <td th:text="${cliente.telefone}"></td>

                        <td th:text="${cliente.cidade}"></td>

                        <td th:text="${cliente.estado}"></td>


                        <!-- STATUS -->

                        <td>

                            <span
                                    th:if="${cliente.ativo}"
                                    class="badge bg-success">

                                Ativo

                            </span>


                            <span
                                    th:unless="${cliente.ativo}"
                                    class="badge bg-secondary">

                                Inativo

                            </span>

                        </td>


                        <!-- AÇÕES -->

                        <td>

                            <div class="d-flex gap-2">

                                <a
                                        th:href="@{/clientes/editar/{id}(id=${cliente.id})}"
                                        class="btn btn-warning btn-sm">

                                    <i class="bi bi-pencil me-1"></i>

                                    Editar

                                </a>


                                <form
                                        th:action="@{/clientes/excluir/{id}(id=${cliente.id})}"
                                        method="post">

                                    <button
                                            type="submit"
                                            class="btn btn-danger btn-sm"
                                            onclick="return confirm('Deseja realmente excluir este cliente?')">

                                        <i class="bi bi-trash me-1"></i>

                                        Excluir

                                    </button>

                                </form>

                            </div>

                        </td>

                    </tr>


                    <!-- CASO NÃO EXISTAM CLIENTES -->

                    <tr th:if="${#lists.isEmpty(clientes)}">

                        <td
                                colspan="8"
                                class="text-center text-muted py-4">

                            Nenhum cliente cadastrado.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>
</html>
